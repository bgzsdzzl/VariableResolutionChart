name: Close Stale Issues and PRs

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          # --- Issues ---
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed in 14 days if no
            further activity occurs. If this is still relevant, please leave
            a comment.
          close-issue-message: >
            This issue was closed because it has been stale for 14 days with
            no activity. Feel free to reopen if it is still relevant.

          # --- Pull Requests ---
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: >
            This pull request has been automatically marked as stale because
            it has not had recent activity. It will be closed in 14 days if
            no further activity occurs. If you are still working on this,
            please leave a comment.
          close-pr-message: >
            This pull request was closed because it has been stale for 14
            days with no activity. Feel free to reopen if you want to
            continue working on it.

          # --- Exemptions ---
          exempt-issue-labels: 'pinned,security,good first issue'
          exempt-pr-labels: 'pinned,security,work-in-progress'
          exempt-all-assignees: true
          exempt-draft-pr: true

          # --- Behavior ---
          operations-per-run: 30
          remove-stale-when-updated: true
          delete-branch: false